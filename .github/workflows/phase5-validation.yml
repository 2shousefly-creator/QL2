name: Phase 5 Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Chiến Tuyến tests
        run: npm run test:chien-tuyen
      - name: TypeScript lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Cloud Run web production build
        run: npm run build:web
      - name: Verify isolated web server
        run: npm run verify:web
      - name: Save transfer regression checks
        run: npm run verify:save-transfer
