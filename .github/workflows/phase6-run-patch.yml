name: Run Chiến Tuyến Phase 6 Patch

on:
  push:
    branches:
      - codex/chien-tuyen-phase-6

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/chien-tuyen-phase-6
          fetch-depth: 0
      - name: Extract and apply saved Phase 6 patch
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          import textwrap, traceback

          workflow = Path('.github/workflows/phase6-apply.yml').read_text(encoding='utf-8')
          start_token = "          python - <<'PY'\n"
          end_token = "\n          PY\n"
          try:
              script = workflow.split(start_token, 1)[1].split(end_token, 1)[0]
              script = textwrap.dedent(script)
              exec(compile(script, 'phase6-embedded-patch.py', 'exec'), {})
              Path('.phase6-patch-result').write_text('success\n', encoding='utf-8')
          except BaseException as exc:
              Path('.phase6-patch-result').write_text(
                  'failure\n' + repr(exc) + '\n' + traceback.format_exc(), encoding='utf-8'
              )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/entertainment/chien_tuyen package.json .phase6-patch-result
          git commit -m "Apply Chiến Tuyến Phase 6 source patch" || true
          git push origin HEAD:codex/chien-tuyen-phase-6
