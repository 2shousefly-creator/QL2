name: Phase 6 Regression Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    name: patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Validate the PR merge checkout; never rewrite source or push a legacy branch.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: Phase 6 regression tests (read-only)
        run: node node_modules/tsx/dist/cli.mjs src/features/entertainment/chien_tuyen/phase6Update.test.ts
      - name: Ensure validation did not modify tracked source
        run: git diff --exit-code
