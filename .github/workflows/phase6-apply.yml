            getTrainingDurationMs,
            getTroopUpgradeDurationMs,
          } from "./config";
          import {
            applyShieldAndHpDamage,
            resolveEndOfRound,
            resolveGrowthPassives,
            resolveUltimateAction,
          } from "./combatEngine";
          import {
            formatChienTuyenDurationForAriaMs,
            formatChienTuyenDurationSeconds,
          } from "./durationFormat";
          import { buildBattleUnitStatistics, createBattleFromUnits, createTroopBattleUnit } from "./engine";
          import {
            createDefaultChienTuyenProfile,
            getTrainingCountForTroop,
            sanitizeChienTuyenProfile,
            startBarracksUpgrade,
            startTroopUpgrade,
          } from "./profileEngine";
          import { BarracksView } from "./components/BarracksView";
          import {
            ARMOR_ULTIMATE_DEFENSE_BONUS_RATIO,
            ARMOR_ULTIMATE_ROUNDS,
            ARTILLERY_ULTIMATE_WAVE_ATTACK_RATIO,
            ENGINEER_ULTIMATE_HEAL_MISSING_HP_RATIO,
            GUARD_ULTIMATE_SHIELD_MAX_HP_RATIO,
            INFANTRY_ULTIMATE_HEAL_MISSING_HP_RATIO,
            INFANTRY_ULTIMATE_PROTECTION_ROUNDS,
            PIONEER_ULTIMATE_ATTACK_RATIO,
            PIONEER_ULTIMATE_STUN_CHANCE,
            getUltimateConfig,
          } from "./ultimateConfig";
          import type { BattleSide, BattleState, BattleUnit, FormationSlotId, TroopType } from "./types";

          let sequence = 0;
          function test(name: string, run: () => void): void {
            run();
            console.log(`PASS: ${name}`);
          }
          function makeUnit(instanceId: string, side: BattleSide, troopType: TroopType, slotId: FormationSlotId, overrides: Partial<BattleUnit> = {}): BattleUnit {
            const base = createTroopBattleUnit({ instanceId, side, troopType, slotId, level: 1 });
            return {
              ...base,
              ...overrides,
              statuses: (overrides.statuses ?? base.statuses).map((status) => ({ ...status })),
              shields: (overrides.shields ?? base.shields).map((shield) => ({ ...shield })),
            };
          }
          function makeState(units: readonly BattleUnit[]): BattleState {
            sequence += 1;
            return createBattleFromUnits({ battleId: `phase6-${sequence}`, matchSeed: `phase6-${sequence}`, units });
          }
          function findUnit(state: BattleState, id: string): BattleUnit {
            const unit = state.units.find((candidate) => candidate.instanceId === id);
            assert.ok(unit, `Missing ${id}`);
            return unit;
          }

          console.log("=== CHIEN TUYEN PHASE 6 UPDATE TESTS ===");

          test("Phase 6 balance constants are canonical", () => {
            assert.equal(GUARD_ULTIMATE_SHIELD_MAX_HP_RATIO, 0.12);
            assert.equal(PIONEER_ULTIMATE_ATTACK_RATIO, 1.35);
            assert.equal(PIONEER_ULTIMATE_STUN_CHANCE, 0.8);
            assert.equal(getUltimateConfig("artillery").ultimateRageRequired, 50);
            assert.equal(ARTILLERY_ULTIMATE_WAVE_ATTACK_RATIO, 0.45);
            assert.equal(COMBAT_CONFIG.passives.airForceAttackPerStack, 0.04);
            assert.equal(ARMOR_ULTIMATE_DEFENSE_BONUS_RATIO, 1.5);
            assert.equal(ARMOR_ULTIMATE_ROUNDS, 3);
            assert.equal(INFANTRY_ULTIMATE_HEAL_MISSING_HP_RATIO, 0.15);
            assert.equal(INFANTRY_ULTIMATE_PROTECTION_ROUNDS, 2);
            assert.equal(ENGINEER_ULTIMATE_HEAL_MISSING_HP_RATIO, 0.22);
          });

          test("Guard 2000 MaxHP gives every living ally exactly 240 Ultimate Shield for two rounds", () => {
            const guard = makeUnit("p6-guard", "player", "guard", "front_left", { maxHp: 2000, hp: 2000, rage: 60 });
            const ally = makeUnit("p6-guard-ally", "player", "infantry", "front_center");
            const enemy = makeUnit("p6-guard-enemy", "enemy", "infantry", "front_left");
            const resolved = resolveUltimateAction(makeState([guard, ally, enemy]), guard.instanceId);
            for (const id of [guard.instanceId, ally.instanceId]) {
              const shield = findUnit(resolved, id).shields.find((entry) => entry.kind === "guard_ultimate");
              assert.equal(shield?.amount, 240);
              assert.equal(shield?.expiresAfterRound, resolved.round + 1);
            }
          });

          test("Pioneer deals 135 percent current ATK while keeping Rage 30 and 80 percent stun tuning", () => {
            const pioneer = makeUnit("p6-pioneer", "player", "pioneer", "front_left", { attack: 100, battleBaseAttack: 100, critChance: 0, rage: 30 });
            const target = makeUnit("p6-pioneer-target", "enemy", "infantry", "front_left", { hp: 1000, maxHp: 1000, defense: 0 });
            const resolved = resolveUltimateAction(makeState([pioneer, target]), pioneer.instanceId);
            assert.equal(getUltimateConfig("pioneer").ultimateRageRequired, 30);
            assert.equal(resolved.events.find((event) => event.type === "ultimate_hit")?.amount, 135);
            assert.equal(PIONEER_ULTIMATE_STUN_CHANCE, 0.8);
          });

          test("Artillery requires 50 Rage and each volley uses 45 percent current ATK", () => {
            const target = makeUnit("p6-artillery-target", "enemy", "infantry", "front_left", { hp: 5000, maxHp: 5000, defense: 0 });
            const short = makeUnit("p6-artillery-short", "player", "artillery", "back_left", { attack: 100, battleBaseAttack: 100, critChance: 0, rage: 49 });
            const noCast = resolveUltimateAction(makeState([short, target]), short.instanceId);
            assert.equal(noCast.events.some((event) => event.type === "ultimate_started"), false);
            const ready = makeUnit("p6-artillery-ready", "player", "artillery", "back_left", { attack: 100, battleBaseAttack: 100, critChance: 0, rage: 50 });
            const cast = resolveUltimateAction(makeState([ready, target]), ready.instanceId);
            assert.equal(cast.events.filter((event) => event.type === "ultimate_hit").length, 3);
            assert.deepEqual(cast.events.filter((event) => event.type === "ultimate_hit").map((event) => event.amount), [45, 45, 45]);
          });

          test("Air Force gains non-compounding 4 percent stacks and Guided Missile keeps plus 10 percent ratio per stack", () => {
            const air = makeUnit("p6-air", "player", "air_force", "back_left", { attack: 100, battleBaseAttack: 100, critChance: 0 });
            const enemy = makeUnit("p6-air-enemy", "enemy", "infantry", "front_left", { hp: 10000, maxHp: 10000, defense: 0 });
            let state = makeState([air, enemy]);
            const expected = new Map([[1, 104], [5, 120], [7, 128], [10, 140]]);
            for (let stack = 1; stack <= 11; stack += 1) {
              state = resolveGrowthPassives(state);
              const current = findUnit(state, air.instanceId);
              if (expected.has(Math.min(stack, 10))) assert.equal(current.attack, expected.get(Math.min(stack, 10)));
            }
            const grown = findUnit(state, air.instanceId);
            assert.equal(grown.passiveStacks, 10);
            assert.equal(grown.attack, 140);
            grown.rage = 40;
            grown.lastDamagedEnemyId = enemy.instanceId;
            const cast = resolveUltimateAction(state, air.instanceId);
            assert.equal(cast.events.filter((event) => event.type === "ultimate_hit").at(-1)?.amount, 315);
          });

          test("Armor Ultimate adds 150 percent reference DEF for three rounds", () => {
            const armor = makeUnit("p6-armor", "player", "armor", "front_left", { defense: 100, battleBaseDefense: 100, rage: 40 });
            const enemy = makeUnit("p6-armor-enemy", "enemy", "infantry", "front_left");
            const cast = resolveUltimateAction(makeState([armor, enemy]), armor.instanceId);
            assert.equal(findUnit(cast, armor.instanceId).defense, 250);
            assert.equal(findUnit(cast, armor.instanceId).armorUltimateDefenseBonus, 150);
            assert.equal(findUnit(cast, armor.instanceId).armorUltimateExpiresAfterRound, cast.round + 2);
          });

          test("Infantry HP floor remains fixed for exactly two rounds", () => {
            const infantry = makeUnit("p6-infantry", "player", "infantry", "front_left", { hp: 500, maxHp: 1000, rage: 60 });
            const enemy = makeUnit("p6-infantry-enemy", "enemy", "infantry", "front_left");
            let state = resolveUltimateAction(makeState([infantry, enemy]), infantry.instanceId);
            const protectedUnit = findUnit(state, infantry.instanceId);
            assert.equal(protectedUnit.hp, 575);
            assert.equal(protectedUnit.statuses.find((status) => status.type === "infantry_death_refusal")?.amount, 100);
            assert.equal(protectedUnit.statuses.find((status) => status.type === "infantry_death_refusal")?.expiresAfterRound, 2);
            applyShieldAndHpDamage(protectedUnit, 9999);
            assert.equal(protectedUnit.hp, 100);
            state.round = 1;
            state = resolveEndOfRound(state);
            assert.equal(findUnit(state, infantry.instanceId).statuses.some((status) => status.type === "infantry_death_refusal"), true);
            applyShieldAndHpDamage(findUnit(state, infantry.instanceId), 9999);
            assert.equal(findUnit(state, infantry.instanceId).hp, 100);
            state.round = 2;
            state = resolveEndOfRound(state);
            assert.equal(findUnit(state, infantry.instanceId).statuses.some((status) => status.type === "infantry_death_refusal"), false);
          });

          test("Engineer heals 22 percent missing HP and statistics count actual heal", () => {
            const engineer = makeUnit("p6-engineer", "player", "engineer", "front_left", { hp: 500, maxHp: 1000, rage: 50 });
            const enemy = makeUnit("p6-engineer-enemy", "enemy", "infantry", "front_left");
            const cast = resolveUltimateAction(makeState([engineer, enemy]), engineer.instanceId);
            assert.equal(findUnit(cast, engineer.instanceId).hp, 610);
            const stats = buildBattleUnitStatistics(cast).find((entry) => entry.instanceId === engineer.instanceId);
            assert.equal(stats?.healingDone, 110);
          });

          test("Barracks progression uses four journey levels per cap and final rank maps to 54", () => {
            assert.equal(MAX_BARRACKS_LEVEL, 54);
            assert.equal(getMaxBarracksLevel(1), 1);
            assert.equal(getMaxBarracksLevel(4), 1);
            assert.equal(getMaxBarracksLevel(5), 2);
            assert.equal(getMaxBarracksLevel(216), 54);
            assert.equal(getMaxBarracksLevel(999), 54);
            assert.equal(getMaxBarracksLevelFromRankIndex(0), 1);
            assert.equal(getMaxBarracksLevelFromRankIndex(3), 1);
            assert.equal(getMaxBarracksLevelFromRankIndex(4), 2);
            assert.equal(getMaxBarracksLevelFromRankIndex(215), 54);
            assert.equal(getRequiredRankIndexForBarracksLevel(54), 212);
          });

          test("Troop cap follows Barracks through levels 25 to 54 and migration preserves valid old progress/jobs", () => {
            const old = createDefaultChienTuyenProfile(0);
            old.barracksLevel = 24;
            old.troopLevels.infantry = 24;
            old.trainingJobs = [{ id: "legacy-job", troopType: "infantry", startedAt: 1, completeAt: 999999, costGold: 10, emergency: false }];
            const oldLoaded = sanitizeChienTuyenProfile(old, 2);
            assert.equal(oldLoaded.barracksLevel, 24);
            assert.equal(oldLoaded.troopLevels.infantry, 24);
            assert.equal(oldLoaded.trainingJobs.length, 1);

            for (const level of [1, 24, 25, 40, 54]) {
              const profile = createDefaultChienTuyenProfile(0);
              profile.barracksLevel = level;
              profile.troopLevels.infantry = level;
              const loaded = sanitizeChienTuyenProfile(profile, 0);
              assert.equal(loaded.troopLevels.infantry, level);
            }
            const invalid = createDefaultChienTuyenProfile(0);
            invalid.barracksLevel = 99;
            invalid.troopLevels.infantry = 99;
            const clamped = sanitizeChienTuyenProfile(invalid, 0);
            assert.equal(clamped.barracksLevel, 54);
            assert.equal(clamped.troopLevels.infantry, 54);

            const barracks25 = createDefaultChienTuyenProfile(0);
            barracks25.barracksLevel = 25;
            barracks25.troopLevels.infantry = 24;
            const upgrade25 = startTroopUpgrade(barracks25, "infantry", 10);
            assert.equal(upgrade25.ok, true);
            assert.equal(upgrade25.value?.targetLevel, 25);
            const barracks54 = createDefaultChienTuyenProfile(0);
            barracks54.barracksLevel = 54;
            barracks54.troopLevels.infantry = 54;
            assert.equal(startTroopUpgrade(barracks54, "infantry", 10).error, "max_level");
          });

          test("Barracks 24 to 25 and 53 to 54 unlock at the correct four-step journey boundaries", () => {
            const p24 = createDefaultChienTuyenProfile(0);
            p24.barracksLevel = 24;
            const to25 = startBarracksUpgrade(p24, 97, 1);
            assert.equal(to25.ok, true);
            assert.equal(to25.value?.targetLevel, 25);
            const p53 = createDefaultChienTuyenProfile(0);
            p53.barracksLevel = 53;
            const to54 = startBarracksUpgrade(p53, 213, 1);
            assert.equal(to54.ok, true);
            assert.equal(to54.value?.targetLevel, 54);
          });

          test("Level 25 to 54 cost and duration formulas remain finite and nonnegative", () => {
            for (const target of [25, 31, 54]) {
              const values = [
                getLevelUpgradeCost(target),
                getBarracksUpgradeDurationMs(target),
                getTroopUpgradeDurationMs("infantry", target),
                getTrainingDurationMs("infantry", target),
                getQuickFinishCost(getBarracksUpgradeDurationMs(target)),
              ];
              assert.equal(values.every((value) => Number.isFinite(value) && value >= 0), true, `invalid values at Lv${target}`);
            }
          });

          test("Shared duration formatter follows seconds, MM:SS and HH:MM:SS rules", () => {
            const cases: Array<[number, string]> = [
              [0, "0 giây"], [5, "5 giây"], [59, "59 giây"], [60, "01:00"], [61, "01:01"],
              [3599, "59:59"], [3600, "01:00:00"], [3661, "01:01:01"], [7200, "02:00:00"],
            ];
            for (const [seconds, expected] of cases) assert.equal(formatChienTuyenDurationSeconds(seconds), expected);
            assert.equal(formatChienTuyenDurationSeconds(-5), "0 giây");
            assert.equal(formatChienTuyenDurationSeconds(360000), "100:00:00");
            assert.equal(formatChienTuyenDurationForAriaMs(150000), "2 phút 30 giây");
          });

          test("Training counts are per troop type and training button separates Gold from Time", () => {
            const profile = createDefaultChienTuyenProfile(0);
            profile.trainingJobs = [
              { id: "ui-i1", troopType: "infantry", startedAt: 0, completeAt: 999999, costGold: 10, emergency: false },
              { id: "ui-i2", troopType: "infantry", startedAt: 0, completeAt: 999999, costGold: 10, emergency: false },
              { id: "ui-a1", troopType: "artillery", startedAt: 0, completeAt: 999999, costGold: 10, emergency: false },
            ];
            assert.equal(getTrainingCountForTroop(profile, "infantry"), 2);
            assert.equal(getTrainingCountForTroop(profile, "artillery"), 1);
            assert.equal(getTrainingCountForTroop(profile, "guard"), 0);
            const markup = renderToStaticMarkup(React.createElement(BarracksView, {
              profile, gold: 99999, maxBarracksLevel: 54, now: 0,
              onTrain: () => undefined, onQuickFinishTraining: () => undefined,
              onUpgradeTroop: () => undefined, onUpgradeBarracks: () => undefined,
              onClaimEmergency: () => undefined,
            }));
            assert.match(markup, /data-action="train-infantry"[^>]*data-training-count="2"/);
            assert.match(markup, /data-action="train-artillery"[^>]*data-training-count="1"/);
            assert.match(markup, /data-action="train-guard"[^>]*data-training-count="0"/);
            assert.match(markup, /×2/);
            assert.match(markup, /data-training-cost="10"/);
            assert.match(markup, /data-training-time=/);
          });

          console.log("CHIEN TUYEN PHASE 6 UPDATE TESTS PASSED");
          '''.replace('          ', ''))

