name: Apply Chiến Tuyến Phase 6

on:
  push:
    branches:
      - codex/chien-tuyen-phase-6

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/chien-tuyen-phase-6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Phase 6 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              p = ROOT / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          def replace(path, old, new, count=1):
              text = read(path)
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old[:120]!r}')
              text = text.replace(old, new, count)
              write(path, text)

          # ---------------- config / progression ----------------
          path = 'src/features/entertainment/chien_tuyen/config.ts'
          replace(path, 'export const MAX_BARRACKS_LEVEL = 24;', 'export const MAX_BARRACKS_LEVEL = 54;')
          replace(path, '    airForceAttackPerStack: 0.05,', '    airForceAttackPerStack: 0.04,')
          replace(path,
              '  return clampInteger(Math.ceil(safeJourneyLevel / 9), MIN_BARRACKS_LEVEL, MAX_BARRACKS_LEVEL);',
              '  return clampInteger(Math.ceil(safeJourneyLevel / 4), MIN_BARRACKS_LEVEL, MAX_BARRACKS_LEVEL);')
          replace(path,
              '  return Math.min(215, (clampBarracksLevel(barracksLevel) - 1) * 9);',
              '  return Math.min(215, (clampBarracksLevel(barracksLevel) - 1) * 4);')

          # ---------------- canonical Ultimate tuning ----------------
          path = 'src/features/entertainment/chien_tuyen/ultimateConfig.ts'
          replace(path,
              '/** Phase 5 canonical Ultimate tuning shared by config, engine and tests. */\nexport const GUARD_ULTIMATE_SHIELD_MAX_HP_RATIO = 0.18;\nexport const GUARD_ULTIMATE_SHIELD_ROUNDS = 2;\nexport const PIONEER_ULTIMATE_ATTACK_RATIO = 2.00;\nexport const PIONEER_ULTIMATE_STUN_CHANCE = 0.80;\nexport const PIONEER_ULTIMATE_STUN_ACTIONS = 1;\nexport const CHEMICAL_ULTIMATE_STUN_CHANCE = 0.45;',
              '/** Phase 6 canonical Ultimate tuning shared by config, engine, UI and tests. */\nexport const INFANTRY_ULTIMATE_HEAL_MISSING_HP_RATIO = 0.15;\nexport const INFANTRY_ULTIMATE_PROTECTION_ROUNDS = 2;\nexport const ARTILLERY_ULTIMATE_WAVE_ATTACK_RATIO = 0.45;\nexport const ARMOR_ULTIMATE_DEFENSE_BONUS_RATIO = 1.50;\nexport const ARMOR_ULTIMATE_ROUNDS = 3;\nexport const ENGINEER_ULTIMATE_HEAL_MISSING_HP_RATIO = 0.22;\nexport const GUARD_ULTIMATE_SHIELD_MAX_HP_RATIO = 0.12;\nexport const GUARD_ULTIMATE_SHIELD_ROUNDS = 2;\nexport const PIONEER_ULTIMATE_ATTACK_RATIO = 1.35;\nexport const PIONEER_ULTIMATE_STUN_CHANCE = 0.80;\nexport const PIONEER_ULTIMATE_STUN_ACTIONS = 1;\nexport const CHEMICAL_ULTIMATE_STUN_CHANCE = 0.45;')
          replace(path,
              'description: "Bộ Binh hồi lại 15% máu đã mất và ngăn lượng máu tụt xuống dưới 10% trong 1 lượt. Nếu HP khi buff bắt đầu đã dưới 10%, HP hiện tại trở thành mức sàn tạm thời.",',
              'description: "Bộ Binh hồi lại 15% máu đã mất và ngăn lượng máu tụt xuống dưới 10% trong 2 lượt. Nếu HP khi buff bắt đầu đã dưới 10%, HP hiện tại trở thành mức sàn tạm thời và giữ nguyên trong cả thời gian buff.",')
          replace(path, '    ultimateRageRequired: 70,', '    ultimateRageRequired: 50,')
          replace(path,
              'description: "Bắn 3 đợt pháo lên toàn bộ kẻ địch còn sống. Mỗi đợt gây 40% ATK hiện tại lên từng mục tiêu; mỗi hit roll CRIT độc lập. Khoảng cách giữa các đợt là 0.75 giây ở tốc độ 1x.",',
              'description: "Bắn 3 đợt pháo lên toàn bộ kẻ địch còn sống. Mỗi đợt gây 45% ATK hiện tại lên từng mục tiêu; mỗi hit roll CRIT độc lập. Khoảng cách giữa các đợt là 0.75 giây ở tốc độ 1x.",')
          replace(path,
              'description: "Tăng 100% DEF hiện tại trong 3 Lượt. Recast không cộng dồn theo cấp số nhân: bonus cũ được thay thế và thời lượng được làm mới.",',
              'description: "Tăng thêm 150% DEF tham chiếu hiện tại trong 3 Lượt (DEF 100 → 250 nếu không có modifier khác). Recast không cộng dồn theo cấp số nhân: bonus cũ được thay thế và thời lượng được làm mới.",')
          replace(path,
              'description: "Tự hồi 30% HP đã mất, Khiêu Khích toàn bộ kẻ địch trong 2 Lượt và tạm thay tỷ lệ phản sát thương trực tiếp từ 45% thành 70%. Recast hồi lại theo HP hiện tại và refresh thời lượng.",',
              'description: "Tự hồi 22% HP đã mất, Khiêu Khích toàn bộ kẻ địch trong 2 Lượt và tạm thay tỷ lệ phản sát thương trực tiếp từ 45% thành 70%. Recast hồi lại theo HP hiện tại và refresh thời lượng.",')
          replace(path,
              'description: "Tạo lá chắn bằng 18% HP tối đa của Vệ Binh cho toàn bộ đồng minh còn sống trong 2 lượt. Lá chắn Ultimate cộng dồn với các nguồn khiên khác và giữ thời hạn riêng.",',
              'description: "Tạo lá chắn bằng 12% HP tối đa của Vệ Binh cho toàn bộ đồng minh còn sống trong 2 lượt. Lá chắn Ultimate cộng dồn với các nguồn khiên khác và giữ thời hạn riêng.",')
          replace(path,
              'description: "Ngẫu nhiên 1 kẻ địch còn sống, gây 200% ATK hiện tại và có 80% xác suất gây Choáng trong 1 lượt.",',
              'description: "Ngẫu nhiên 1 kẻ địch còn sống, gây 135% ATK hiện tại và có 80% xác suất gây Choáng trong 1 lượt.",')

          # ---------------- combat engine ----------------
          path = 'src/features/entertainment/chien_tuyen/combatEngine.ts'
          replace(path,
              '  BASIC_ATTACK_RAGE_GAIN,\n  CHEMICAL_ULTIMATE_STUN_CHANCE,',
              '  ARMOR_ULTIMATE_DEFENSE_BONUS_RATIO,\n  ARMOR_ULTIMATE_ROUNDS,\n  ARTILLERY_ULTIMATE_WAVE_ATTACK_RATIO,\n  BASIC_ATTACK_RAGE_GAIN,\n  CHEMICAL_ULTIMATE_STUN_CHANCE,\n  ENGINEER_ULTIMATE_HEAL_MISSING_HP_RATIO,')
          replace(path,
              '  GUARD_ULTIMATE_SHIELD_ROUNDS,\n  hasImplementedUltimate,',
              '  GUARD_ULTIMATE_SHIELD_ROUNDS,\n  hasImplementedUltimate,\n  INFANTRY_ULTIMATE_HEAL_MISSING_HP_RATIO,\n  INFANTRY_ULTIMATE_PROTECTION_ROUNDS,')
          replace(path, '  applyHealInPlace(state, attacker, attacker, missingHp * 0.15, attacker.ultimateId);',
                        '  applyHealInPlace(state, attacker, attacker, missingHp * INFANTRY_ULTIMATE_HEAL_MISSING_HP_RATIO, attacker.ultimateId);')
          replace(path, '    expiresAfterRound: state.round,',
                        '    expiresAfterRound: state.round + INFANTRY_ULTIMATE_PROTECTION_ROUNDS - 1,')
          replace(path, '    durationRounds: 1,\n    side: attacker.side,\n    statusId: status.id,\n    statusType: status.type,\n    ultimateId: attacker.ultimateId,\n    message: "TỪ CHỐI TỬ THẦN",',
                        '    durationRounds: INFANTRY_ULTIMATE_PROTECTION_ROUNDS,\n    side: attacker.side,\n    statusId: status.id,\n    statusType: status.type,\n    ultimateId: attacker.ultimateId,\n    message: "TỪ CHỐI TỬ THẦN",')
          replace(path, '  const perHitRaw = Math.max(0, attacker.attack) * 0.4;',
                        '  const perHitRaw = Math.max(0, attacker.attack) * ARTILLERY_ULTIMATE_WAVE_ATTACK_RATIO;')
          replace(path, '  const newBonus = defenseWithoutOwnBuff;\n  attacker.armorUltimateDefenseBonus = newBonus;\n  attacker.armorUltimateExpiresAfterRound = state.round + 2;',
                        '  const newBonus = Math.max(0, defenseWithoutOwnBuff) * ARMOR_ULTIMATE_DEFENSE_BONUS_RATIO;\n  attacker.armorUltimateDefenseBonus = newBonus;\n  attacker.armorUltimateExpiresAfterRound = state.round + ARMOR_ULTIMATE_ROUNDS - 1;')
          replace(path, '    durationRounds: 3,\n    ultimateId: attacker.ultimateId,\n    side: attacker.side,',
                        '    durationRounds: ARMOR_ULTIMATE_ROUNDS,\n    ultimateId: attacker.ultimateId,\n    side: attacker.side,')
          replace(path, '  applyHealInPlace(state, attacker, attacker, missingHp * 0.30, attacker.ultimateId);',
                        '  applyHealInPlace(state, attacker, attacker, missingHp * ENGINEER_ULTIMATE_HEAL_MISSING_HP_RATIO, attacker.ultimateId);')

          # ---------------- troop catalog ----------------
          path = 'src/features/entertainment/chien_tuyen/troopCatalog.ts'
          replace(path,
              'description: "Không Quân tăng thêm 5% ATK sau mỗi lượt, cộng dồn tối đa 10 lần.",',
              'description: "Không Quân tăng thêm 4% ATK sau mỗi lượt, cộng dồn tối đa 10 lần.",')
          replace(path, 'parameters: { attackPerStack: 0.05, maxStacks: 10, compounds: false },',
                        'parameters: { attackPerStack: 0.04, maxStacks: 10, compounds: false },')

          # ---------------- profile cap / migration / helper ----------------
          path = 'src/features/entertainment/chien_tuyen/profileEngine.ts'
          replace(path, '  MAX_FORMATION_UNITS,\n  LEGACY_MAX_FORMATION_UNITS,',
                        '  MAX_FORMATION_UNITS,\n  MAX_BARRACKS_LEVEL,\n  LEGACY_MAX_FORMATION_UNITS,')
          replace(path, '  if (!job || barracksLevel >= 24) return null;',
                        '  if (!job || barracksLevel >= MAX_BARRACKS_LEVEL) return null;')
          replace(path, '  const targetLevel = finiteInteger(job.targetLevel, barracksLevel + 1, barracksLevel + 1, 24);',
                        '  const targetLevel = finiteInteger(job.targetLevel, barracksLevel + 1, barracksLevel + 1, MAX_BARRACKS_LEVEL);')
          replace(path, '      level: finiteInteger(unit.level, troopLevels[unit.troopType], 1, 24),',
                        '      level: finiteInteger(unit.level, troopLevels[unit.troopType], 1, MAX_BARRACKS_LEVEL),')
          replace(path, '  const barracksLevel = clampBarracksLevel(finiteInteger(source.barracksLevel, 1, 1, 24));',
                        '  const barracksLevel = clampBarracksLevel(finiteInteger(source.barracksLevel, 1, 1, MAX_BARRACKS_LEVEL));')
          replace(path, '    troopLevels[troopType] = clampTroopLevel(finiteInteger(rawLevels?.[troopType], 1, 1, 24), barracksLevel);',
                        '    troopLevels[troopType] = clampTroopLevel(finiteInteger(rawLevels?.[troopType], 1, 1, MAX_BARRACKS_LEVEL), barracksLevel);')
          replace(path, '  if (fromLevel >= 24) return { ok: false, profile: next, costGold: 0, error: "max_level" };',
                        '  if (fromLevel >= MAX_BARRACKS_LEVEL) return { ok: false, profile: next, costGold: 0, error: "max_level" };')
          replace(path, '  if (next.barracksLevel >= 24) return { ok: false, profile: next, costGold: 0, error: "max_level" };',
                        '  if (next.barracksLevel >= MAX_BARRACKS_LEVEL) return { ok: false, profile: next, costGold: 0, error: "max_level" };')
          marker = 'export function getTotalTrainingUnits(profile: Pick<ChienTuyenProfileV2, "trainingJobs">): number {\n  return profile.trainingJobs.length;\n}\n'
          replacement = marker + '\nexport function getTrainingCountForTroop(\n  profile: Pick<ChienTuyenProfileV2, "trainingJobs">,\n  troopType: TroopType\n): number {\n  return profile.trainingJobs.reduce(\n    (count, job) => count + (job.troopType === troopType ? 1 : 0),\n    0\n  );\n}\n'
          replace(path, marker, replacement)

          # ---------------- common duration formatter ----------------
          write('src/features/entertainment/chien_tuyen/durationFormat.ts', '''function normalizeDurationSeconds(seconds: number): number {
            if (!Number.isFinite(seconds)) return 0;
            return Math.max(0, Math.ceil(seconds));
          }

          export function formatChienTuyenDurationSeconds(secondsInput: number): string {
            const seconds = normalizeDurationSeconds(secondsInput);
            if (seconds < 60) return `${seconds} giây`;
            const secondPart = String(seconds % 60).padStart(2, "0");
            const totalMinutes = Math.floor(seconds / 60);
            if (seconds < 3600) {
              return `${String(totalMinutes).padStart(2, "0")}:${secondPart}`;
            }
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${secondPart}`;
          }

          export function formatChienTuyenDurationMs(durationMs: number): string {
            const safeMs = Number.isFinite(durationMs) ? Math.max(0, durationMs) : 0;
            return formatChienTuyenDurationSeconds(Math.ceil(safeMs / 1000));
          }

          export function formatChienTuyenDurationForAriaMs(durationMs: number): string {
            const safeMs = Number.isFinite(durationMs) ? Math.max(0, durationMs) : 0;
            const seconds = normalizeDurationSeconds(Math.ceil(safeMs / 1000));
            if (seconds < 60) return `${seconds} giây`;
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const remainingSeconds = seconds % 60;
            const parts: string[] = [];
            if (hours > 0) parts.push(`${hours} giờ`);
            if (minutes > 0) parts.push(`${minutes} phút`);
            if (remainingSeconds > 0) parts.push(`${remainingSeconds} giây`);
            return parts.length > 0 ? parts.join(" ") : "0 giây";
          }
          '''.replace('          ', ''))

          # ---------------- Barracks UI ----------------
          path = 'src/features/entertainment/chien_tuyen/components/BarracksView.tsx'
          replace(path, 'import { canUseEmergencyTraining } from "../profileEngine";',
                        'import { canUseEmergencyTraining, getTrainingCountForTroop } from "../profileEngine";\nimport { formatChienTuyenDurationForAriaMs, formatChienTuyenDurationMs } from "../durationFormat";')
          old_func = '''function formatRemaining(remainingMs: number): string {
            const seconds = Math.max(0, Math.ceil((Number.isFinite(remainingMs) ? remainingMs : 0) / 1000));
            const minutes = Math.floor(seconds / 60);
            return `${minutes}:${String(seconds % 60).padStart(2, "0")}`;
          }

          '''.replace('          ', '')
          replace(path, old_func, '')
          text = read(path).replace('formatRemaining(', 'formatChienTuyenDurationMs(')
          write(path, text)
          replace(path,
              '            const trainingCost = getTrainingCost(troop.id);\n            const upgradeJob = profile.troopUpgradeJobs[troop.id];',
              '            const trainingCost = getTrainingCost(troop.id);\n            const trainingDurationMs = getTrainingDurationMs(troop.id, level);\n            const trainingCount = getTrainingCountForTroop(profile, troop.id);\n            const upgradeJob = profile.troopUpgradeJobs[troop.id];')
          old_button = '''                <button
                  type="button"
                  disabled={trainingFull || gold < trainingCost}
                  onClick={() => onTrain(troop.id)}
                  className="ct-v2-train-button"
                  data-action={`train-${troop.id}`}
                >
                  <Users className="h-4 w-4" /> Đào tạo · {trainingCost} <Coins className="h-3.5 w-3.5" /> · {formatChienTuyenDurationMs(getTrainingDurationMs(troop.id, level))}
                </button>'''
          new_button = '''                <button
                  type="button"
                  disabled={trainingFull || gold < trainingCost}
                  onClick={() => onTrain(troop.id)}
                  className="ct-v2-train-button ct-v2-train-button--phase6"
                  data-action={`train-${troop.id}`}
                  data-training-count={trainingCount}
                  aria-label={`Đào tạo ${troop.name}, giá ${trainingCost} Vàng, thời gian ${formatChienTuyenDurationForAriaMs(trainingDurationMs)}, hiện có ${trainingCount} ${troop.name} đang đào tạo.`}
                >
                  <span className="ct-v2-train-button-main">
                    <Users className="h-4 w-4" aria-hidden="true" />
                    <span>ĐÀO TẠO</span>
                    {trainingCount > 0 && <span className="ct-v2-train-count-badge" aria-hidden="true">×{trainingCount}</span>}
                  </span>
                  <span className="ct-v2-train-button-meta">
                    <span className="ct-v2-train-meta-group ct-v2-train-cost" data-training-cost={trainingCost}>
                      <Coins className="h-3.5 w-3.5" aria-hidden="true" /><span>{trainingCost} Vàng</span>
                    </span>
                    <span className="ct-v2-train-meta-group ct-v2-train-time" data-training-time={formatChienTuyenDurationMs(trainingDurationMs)}>
                      <Timer className="h-3.5 w-3.5" aria-hidden="true" /><span>{formatChienTuyenDurationMs(trainingDurationMs)}</span>
                    </span>
                  </span>
                </button>'''
          replace(path, old_button, new_button)

          # ---------------- Upgrade modal duration helper ----------------
          path = 'src/features/entertainment/chien_tuyen/components/TroopUpgradeModal.tsx'
          replace(path, 'import { getTroopStats, TROOP_BY_TYPE } from "../troopCatalog";',
                        'import { getTroopStats, TROOP_BY_TYPE } from "../troopCatalog";\nimport { formatChienTuyenDurationMs } from "../durationFormat";')
          old_func = '''function formatDuration(durationMs: number): string {
            const seconds = Math.max(0, Math.ceil(durationMs / 1000));
            const minutes = Math.floor(seconds / 60);
            return `${minutes}:${String(seconds % 60).padStart(2, "0")}`;
          }

          '''.replace('          ', '')
          replace(path, old_func, '')
          replace(path, '{formatDuration(duration)}', '{formatChienTuyenDurationMs(duration)}')

          # ---------------- Battle UI Air Force stack ----------------
          path = 'src/features/entertainment/chien_tuyen/ChienTuyenGame.tsx'
          replace(path,
              'import { BATTLE_SPEEDS, DEPLOYMENT_SECONDS, MAX_FORMATION_UNITS, MAX_SAME_TROOP_TYPE, getBattlePressureMultiplier, getFormationSlotsForSide } from "./config";',
              'import { BATTLE_SPEEDS, COMBAT_CONFIG, DEPLOYMENT_SECONDS, MAX_FORMATION_UNITS, MAX_SAME_TROOP_TYPE, getBattlePressureMultiplier, getFormationSlotsForSide } from "./config";')
          replace(path,
              '{unit.passiveId === "air_force_attack_growth" && unit.passiveStacks > 0 && <span className="ct-v2-stack"><Sparkles className="h-2.5 w-2.5" />THỐNG TRỊ ×{unit.passiveStacks}</span>}',
              '{unit.passiveId === "air_force_attack_growth" && unit.passiveStacks > 0 && <span className="ct-v2-stack" aria-label={`Thống Trị Bầu Trời ${unit.passiveStacks} cộng dồn`}>✨x{unit.passiveStacks}</span>}')
          replace(path,
              'unit.passiveId === "air_force_attack_growth" ? `Thống Trị Bầu Trời: ${unit.passiveStacks}/10 cộng dồn · +${Math.round(unit.passiveStacks * 5)}% ATK` : null,',
              'unit.passiveId === "air_force_attack_growth" ? `Thống Trị Bầu Trời: ${unit.passiveStacks}/${COMBAT_CONFIG.passives.maxGrowthStacks} cộng dồn · +${Math.round(unit.passiveStacks * COMBAT_CONFIG.passives.airForceAttackPerStack * 100)}% ATK` : null,')

          # ---------------- CSS presentation ----------------
          path = 'src/features/entertainment/chien_tuyen/chienTuyen.css'
          css = read(path)
          css += '''

          /* Phase 6: compact per-troop training controls and Air Force stack badge. */
          .ct-v2-train-button--phase6 {
            flex-direction: column;
            align-items: stretch;
            gap: .35rem;
            padding: .55rem .6rem;
          }
          .ct-v2-train-button-main {
            display: flex;
            min-width: 0;
            align-items: center;
            justify-content: center;
            gap: .35rem;
            font-weight: 900;
          }
          .ct-v2-train-count-badge {
            display: inline-flex;
            min-width: 1.45rem;
            height: 1.15rem;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: rgba(15, 23, 42, .14);
            padding: 0 .35rem;
            font-size: .62rem;
            line-height: 1;
            font-weight: 900;
          }
          .ct-v2-train-button-meta {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: .3rem;
          }
          .ct-v2-train-meta-group {
            display: flex;
            min-width: 0;
            align-items: center;
            justify-content: center;
            gap: .2rem;
            border-radius: .65rem;
            padding: .24rem .3rem;
            font-size: .6rem;
            font-weight: 900;
            white-space: nowrap;
          }
          .ct-v2-train-cost { background: rgba(251, 191, 36, .2); color: #92400e; }
          .ct-v2-train-time { background: rgba(34, 211, 238, .18); color: #075985; }
          .ct-v2-train-button:disabled .ct-v2-train-meta-group { opacity: .58; }
          .ct-v2-stack {
            max-width: max-content;
            padding: 2px 5px;
            font-size: 9px;
            letter-spacing: 0;
            white-space: nowrap;
          }
          '''.replace('          ', '')
          write(path, css)

          # ---------------- stale regression fixtures ----------------
          path = 'src/features/entertainment/chien_tuyen/domainEngine.test.ts'
          replace(path, '  const maxStats = getTroopStats(troopType, 24);', '  const maxStats = getTroopStats(troopType, 54);')
          replace(path, ' * 23, `${troopType} fixed HP growth`', ' * 53, `${troopType} fixed HP growth`')
          replace(path, ' * 23, `${troopType} fixed ATK growth`', ' * 53, `${troopType} fixed ATK growth`')
          replace(path, ' * 23, `${troopType} fixed DEF growth`', ' * 53, `${troopType} fixed DEF growth`')
          replace(path, 'equal(getRequiredRankIndexForBarracksLevel(2), 9, "barracks level two requires the tenth rank step");',
                        'equal(getRequiredRankIndexForBarracksLevel(2), 4, "barracks level two requires the fifth rank step");')
          replace(path, 'equal(getRequiredRankIndexForBarracksLevel(24), 207, "barracks level twenty-four has a bounded rank requirement");',
                        'equal(getRequiredRankIndexForBarracksLevel(54), 212, "barracks level fifty-four starts at rank index 212");')
          replace(path,
              'equal(getMaxBarracksLevel(9), 1, "journey level 9 still unlocks Barracks 1");\nequal(getMaxBarracksLevel(10), 2, "journey level 10 unlocks Barracks 2");\nequal(getMaxBarracksLevel(216), 24, "journey level 216 unlocks Barracks 24");\nequal(getMaxBarracksLevelFromRankIndex(215), 24, "zero-based currentRankIndex maps to one-based journey level");',
