name: Gomoku AI Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/training/gomoku-v13/**'
      - 'scripts/gomoku/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/gomoku-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gomoku:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run test:gomoku
      - run: npm run lint
      - run: npm run build
